name: Daily Lesson

on:
  schedule:
    # GitHub cron runs in UTC. 16:00 UTC = 9:00 PM Pakistan Time (UTC+5).
    - cron: "0 16 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  add-lesson:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute lesson date
        id: date
        run: echo "today=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_OUTPUT"

      - name: Write today's lesson with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowed-tools Read,Write,Edit,Glob,Grep --max-turns 20"
          prompt: |
            You maintain a study repository for the Claude Certified Architect exam.
            Today's date is ${{ steps.date.outputs.today }}.

            Task: add ONE new lesson.

            1. Read `lessons/INDEX.md` (create it if missing) and the existing notes in the repo
               so you do not repeat a topic that is already covered.
            2. Pick the next uncovered topic, rotating across these exam domains:
               - Agentic architecture & orchestration
               - Tool design & MCP integration
               - Claude Code configuration & workflows
               - Prompt engineering & structured output
               - Context management & reliability
            3. Create `lessons/${{ steps.date.outputs.today }}-<short-kebab-topic>.md` containing:
               - `# <Lesson title>` and a line with the domain and date
               - Learning objectives (3-5 bullets)
               - Core explanation with concrete examples (code/config snippets where useful)
               - Common exam pitfalls / gotchas
               - 3 practice questions with answers and explanations in a collapsible `<details>` block
               - Key takeaways (bullet summary)
            4. Append a line to `lessons/INDEX.md`:
               `- ${{ steps.date.outputs.today }} — [<title>](<filename>) — <domain>`

            Rules: only create or edit Markdown (.md) files inside `lessons/`.
            If a lesson file for today's date already exists, do nothing.

      - name: Commit and push lesson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/*.md
          if git diff --cached --quiet; then
            echo "No new lesson to commit."
            exit 0
          fi
          git commit -m "Add daily lesson for ${{ steps.date.outputs.today }}"
          git push
